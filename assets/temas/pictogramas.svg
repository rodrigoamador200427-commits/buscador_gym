<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pictogramas de los temas del árbol de Temas. Dibujos originales del proyecto: geométricos,
  sin texto. Cada uno ocupa una celda de 48 x 48 y se usa por separado desde
  assets/ilustraciones.js con <use href="assets/temas/pictogramas.svg#tema-...">.
  Abierto solo, este archivo muestra la hoja completa (5 x 2).

  Colores: ninguno fijo. El trazo principal usa la variable CSS "ilu-tinta" y el detalle
  destacado "ilu-resaltado" (con dos guiones delante, que aquí no se escriben porque un
  comentario XML no los admite). Abierto solo, todo se pinta con currentColor.
  El estilo va en cada grupo y no en una hoja <style>, porque <use> desde otro documento
  solo copia el grupo referenciado.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 104" role="img" aria-labelledby="titulo">
  <title id="titulo">Pictogramas de los temas</title>

  <!-- Fuerza: barra con discos -->
  <g transform="translate(0 0)">
    <g id="tema-fuerza" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <path d="M4 24H44"/>
      <rect x="4.5" y="16" width="4.5" height="16" rx="2" style="fill:var(--ilu-tinta,currentColor);stroke:none"/>
      <rect x="39" y="16" width="4.5" height="16" rx="2" style="fill:var(--ilu-tinta,currentColor);stroke:none"/>
      <rect x="10.5" y="11" width="6" height="26" rx="2.5" style="fill:var(--ilu-resaltado,currentColor);stroke:none"/>
      <rect x="31.5" y="11" width="6" height="26" rx="2.5" style="fill:var(--ilu-resaltado,currentColor);stroke:none"/>
    </g>
  </g>

  <!-- Hipertrofia: núcleo que crece en anillos -->
  <g transform="translate(56 0)">
    <g id="tema-hipertrofia" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <circle cx="24" cy="24" r="5.5" style="fill:var(--ilu-resaltado,currentColor);stroke:none"/>
      <circle cx="24" cy="24" r="12"/>
      <circle cx="24" cy="24" r="19.5" stroke-dasharray="6 5.14"/>
    </g>
  </g>

  <!-- Resistencia: pulso sostenido -->
  <g transform="translate(112 0)">
    <g id="tema-resistencia" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <circle cx="24" cy="24" r="19.5"/>
      <path d="M9 25H16L20 15L25 34L29 21L31.5 25H39" style="stroke:var(--ilu-resaltado,currentColor)"/>
    </g>
  </g>

  <!-- Técnica y biomecánica: palanca con su ángulo -->
  <g transform="translate(168 0)">
    <g id="tema-tecnica" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <path d="M14 36H43"/>
      <path d="M14 36L33 9"/>
      <path d="M31 36A17 17 0 0 0 23.8 22.1" style="stroke:var(--ilu-resaltado,currentColor)"/>
      <circle cx="14" cy="36" r="4.5" style="fill:var(--ilu-tinta,currentColor);stroke:none"/>
    </g>
  </g>

  <!-- Planificación: calendario con un día marcado -->
  <g transform="translate(224 0)">
    <g id="tema-planificacion" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <rect x="6" y="9" width="36" height="33" rx="5"/>
      <path d="M6 19H42M16 5V12M32 5V12"/>
      <g style="fill:var(--ilu-tinta,currentColor);stroke:none">
        <rect x="12.5" y="24" width="5" height="5" rx="1"/>
        <rect x="21.5" y="24" width="5" height="5" rx="1"/>
        <rect x="30.5" y="24" width="5" height="5" rx="1"/>
        <rect x="12.5" y="32.5" width="5" height="5" rx="1"/>
        <rect x="30.5" y="32.5" width="5" height="5" rx="1"/>
      </g>
      <rect x="21.5" y="32.5" width="5" height="5" rx="1" style="fill:var(--ilu-resaltado,currentColor);stroke:none"/>
    </g>
  </g>

  <!-- Recuperación: luna (descanso) -->
  <g transform="translate(0 56)">
    <g id="tema-recuperacion" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <path d="M28 6A18.5 18.5 0 1 0 42 31A15 15 0 0 1 28 6Z" style="fill:var(--ilu-tinta,currentColor);stroke:none"/>
      <circle cx="37" cy="14" r="2.6" style="fill:var(--ilu-resaltado,currentColor);stroke:none"/>
      <circle cx="43.5" cy="21" r="1.6" style="fill:var(--ilu-resaltado,currentColor);stroke:none"/>
    </g>
  </g>

  <!-- Prevención y movilidad: escudo con cruz -->
  <g transform="translate(56 56)">
    <g id="tema-prevencion" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <path d="M24 5L41 11V23Q41 36 24 43Q7 36 7 23V11Z"/>
      <path d="M24 16V32M16 24H32" stroke-width="4.5" style="stroke:var(--ilu-resaltado,currentColor)"/>
    </g>
  </g>

  <!-- Alimentación: plato con cubiertos -->
  <g transform="translate(112 56)">
    <g id="tema-alimentacion" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <path d="M4.5 7V14Q4.5 18.5 8 18.5Q11.5 18.5 11.5 14V7M8 7V41"/>
      <circle cx="26" cy="24" r="11"/>
      <circle cx="26" cy="24" r="4.8" style="fill:var(--ilu-resaltado,currentColor);stroke:none"/>
      <path d="M42.5 41V7Q46.5 13 45.5 25H42.5"/>
    </g>
  </g>

  <!-- Suplementación: cápsula -->
  <g transform="translate(168 56)">
    <g id="tema-suplementacion" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <g transform="rotate(-45 24 24)">
        <path d="M24 15H14A9 9 0 0 0 14 33H24Z" style="fill:var(--ilu-resaltado,currentColor);stroke:none"/>
        <rect x="5" y="15" width="38" height="18" rx="9"/>
        <path d="M24 15V33"/>
      </g>
    </g>
  </g>

  <!-- Respaldo: documento sin tema asignado -->
  <g transform="translate(224 56)">
    <g id="tema-respaldo" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ilu-tinta,currentColor)">
      <path d="M12 5H29L38 14V43H12Z"/>
      <path d="M29 5V14H38"/>
      <path d="M18 23H32M18 30H32M18 37H26"/>
    </g>
  </g>
</svg>
