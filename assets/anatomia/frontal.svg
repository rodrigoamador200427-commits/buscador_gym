<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cuerpo humano, vista frontal. Dibujo original del proyecto: esquemático, de una sola tinta.
  Lienzo 200 x 400; el lado izquierdo es el espejo del derecho.

  Colores: ninguno fijo. Cada región se pinta con la variable CSS "ilu-<id>"; si no está
  definida, con "ilu-base"; y si tampoco, con currentColor (las variables llevan dos guiones
  delante, que aquí no se escriben porque un comentario XML no los admite).
    - abierto solo: todo se pinta con currentColor (una tinta);
    - en la interfaz: "ilu-base" atenúa todo y "ilu-<id>" resalta una región.
  Se usa desde assets/ilustraciones.js con <use href="assets/anatomia/frontal.svg#cuerpo">.
  Regiones con id: hombro, pecho, biceps, antebrazos, abdomen, cuadriceps.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" role="img" aria-labelledby="titulo">
  <title id="titulo">Cuerpo humano, vista frontal</title>
  <g id="cuerpo">
    <g id="silueta" style="fill:var(--ilu-base,currentColor)">
      <ellipse cx="100" cy="31" rx="18" ry="22"/>
      <path d="M93 57H107V66Q100 69 93 66Z"/>
      <path d="M110 61L134 66.5L131 69H110Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M110 61L134 66.5L131 69H110Z"/></g>
      <ellipse cx="157" cy="217" rx="5.5" ry="10"/>
      <g transform="matrix(-1 0 0 1 200 0)"><ellipse cx="157" cy="217" rx="5.5" ry="10"/></g>
      <path d="M103 188.5L129.5 166.5L132.5 182L103 204Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M103 188.5L129.5 166.5L132.5 182L103 204Z"/></g>
      <ellipse cx="118.2" cy="293.5" rx="9.3" ry="6.5"/>
      <g transform="matrix(-1 0 0 1 200 0)"><ellipse cx="118.2" cy="293.5" rx="9.3" ry="6.5"/></g>
      <path d="M109 304H127.5Q131 322 127.5 344L124.5 372H114.5Q107.5 334 109 304Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M109 304H127.5Q131 322 127.5 344L124.5 372H114.5Q107.5 334 109 304Z"/></g>
      <path d="M113.5 376H125Q133 385 131.5 391H111Q109.5 383 113.5 376Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M113.5 376H125Q133 385 131.5 391H111Q109.5 383 113.5 376Z"/></g>
    </g>
    <g id="hombro" style="fill:var(--ilu-hombro,var(--ilu-base,currentColor))">
      <path d="M138 67Q157 67 157 93Q157 103 150 109Q142 99 139 87Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M138 67Q157 67 157 93Q157 103 150 109Q142 99 139 87Z"/></g>
    </g>
    <g id="pecho" style="fill:var(--ilu-pecho,var(--ilu-base,currentColor))">
      <path d="M102 72H125Q135 74 134 90Q132 105 117 106H102Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M102 72H125Q135 74 134 90Q132 105 117 106H102Z"/></g>
    </g>
    <g id="biceps" style="fill:var(--ilu-biceps,var(--ilu-base,currentColor))">
      <path d="M141 103L149.7 113L157.5 106.5L158.5 151Q152.5 155 146.5 151Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M141 103L149.7 113L157.5 106.5L158.5 151Q152.5 155 146.5 151Z"/></g>
    </g>
    <g id="antebrazos" style="fill:var(--ilu-antebrazos,var(--ilu-base,currentColor))">
      <path d="M146.5 158Q153 154 159.5 158L160.5 203Q156.5 206 152.5 203Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M146.5 158Q153 154 159.5 158L160.5 203Q156.5 206 152.5 203Z"/></g>
    </g>
    <g id="abdomen" style="fill:var(--ilu-abdomen,var(--ilu-base,currentColor))">
      <rect x="102" y="110" width="15" height="18" rx="3"/>
      <g transform="matrix(-1 0 0 1 200 0)"><rect x="102" y="110" width="15" height="18" rx="3"/></g>
      <rect x="102" y="131" width="15" height="18" rx="3"/>
      <g transform="matrix(-1 0 0 1 200 0)"><rect x="102" y="131" width="15" height="18" rx="3"/></g>
      <path d="M102 152H117V171L102 184Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M102 152H117V171L102 184Z"/></g>
      <path d="M120.5 110H130Q131 140 127 163L120.5 168.5Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M120.5 110H130Q131 140 127 163L120.5 168.5Z"/></g>
    </g>
    <g id="cuadriceps" style="fill:var(--ilu-cuadriceps,var(--ilu-base,currentColor))">
      <path d="M103 208L133 186Q137 215 134 245Q132 268 127.5 284H109Q103.5 250 103 208Z"/>
      <g transform="matrix(-1 0 0 1 200 0)"><path d="M103 208L133 186Q137 215 134 245Q132 268 127.5 284H109Q103.5 250 103 208Z"/></g>
    </g>
  </g>
</svg>
