<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscador Gym</title>
    <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

    <!-- BARRA SUPERIOR FIJA: nombre, búsqueda y menú del perfil activo -->
    <header class="barra">
        <div class="contenedor barra-contenido">
            <div class="marca">Buscador Gym</div>
            <form class="busqueda" id="formBusqueda" role="search" hidden>
                <input type="search" id="searchInput" autocomplete="off" maxlength="200"
                       aria-label="Buscar ejercicios y artículos" placeholder="Buscar ejercicios y artículos">
            </form>
            <details class="menu-perfil" id="menuPerfil" hidden>
                <summary id="nombrePerfil"></summary>
                <div class="menu-opciones">
                    <div class="correo" id="correoCuenta"></div>
                    <button type="button" id="btnCambiarPerfil">Cambiar perfil</button>
                    <button type="button" data-accion="logout">Cerrar sesión</button>
                </div>
            </details>
        </div>
    </header>

    <!-- ACCESO: iniciar sesión / crear cuenta -->
    <section id="pantallaAcceso" class="acceso" hidden>
        <div class="panel">
            <div class="pestanas" role="tablist">
                <button class="pestana" id="tabLogin" type="button" role="tab" aria-selected="true">Iniciar sesión</button>
                <button class="pestana" id="tabRegistro" type="button" role="tab" aria-selected="false">Crear cuenta</button>
            </div>
            <form id="formLogin">
                <label class="campo">Correo <input type="email" name="correo" autocomplete="username" required maxlength="254"></label>
                <label class="campo">Contraseña <input type="password" name="contrasena" autocomplete="current-password" required maxlength="72"></label>
                <div class="msg-error" id="errLogin" role="alert"></div>
                <button class="btn btn-primario" type="submit">Entrar</button>
            </form>
            <form id="formRegistro" hidden>
                <label class="campo">Nombre completo <input name="nombre_completo" autocomplete="name" required maxlength="100"></label>
                <label class="campo">Fecha de nacimiento <input type="date" name="fecha_nacimiento" required></label>
                <label class="campo">Correo <input type="email" name="correo" autocomplete="username" required maxlength="254"></label>
                <label class="campo">Contraseña (10 caracteres o más, con letras y números) <input type="password" name="contrasena" autocomplete="new-password" required minlength="10" maxlength="72"></label>
                <div class="msg-error" id="errRegistro" role="alert"></div>
                <button class="btn btn-primario" type="submit">Crear cuenta</button>
            </form>
        </div>
    </section>

    <!-- SELECTOR DE PERFIL (máximo 4 por cuenta) -->
    <section id="pantallaPerfiles" class="acceso acceso-ancho" hidden>
        <div class="panel">
            <h2>Elige un perfil</h2>
            <div id="listaPerfiles" class="lista-perfiles"></div>
            <form id="formPerfil" class="form-perfil">
                <label class="campo">Nombre del perfil nuevo <input name="nombre" required maxlength="40"></label>
                <button class="btn btn-primario" type="submit">Crear perfil</button>
            </form>
            <div class="msg-error" id="errPerfiles" role="alert"></div>
            <div class="pie-perfiles"><button class="btn" type="button" data-accion="logout">Cerrar sesión</button></div>
        </div>
    </section>

    <div id="app" hidden>
        <nav class="contenedor pestanas" role="tablist">
            <button class="pestana" type="button" role="tab" data-vista="vistaBusqueda">Búsqueda y recomendaciones</button>
            <button class="pestana" type="button" role="tab" data-vista="vistaArboles">Explorar por árboles</button>
        </nav>

        <!-- VISTA 1: búsqueda y recomendaciones -->
        <main class="contenedor disposicion" id="vistaBusqueda">
            <details class="lateral" id="lateral" open>
                <summary>Filtros y perfil</summary>
                <section class="panel" aria-labelledby="tituloFiltros">
                    <h2 id="tituloFiltros">Filtros</h2>
                    <div class="filtro-grupo">
                        <h3>Tipo de documento</h3>
                        <label class="opcion"><input type="checkbox" data-tipo="ejercicios" checked> Ejercicios <span class="n" id="nEjercicios"></span></label>
                        <label class="opcion"><input type="checkbox" data-tipo="articulos" checked> Artículos <span class="n" id="nArticulos"></span></label>
                    </div>
                    <div class="filtro-grupo" id="grupoNivel" hidden>
                        <h3>Nivel</h3>
                        <div id="opcionesNivel"></div>
                    </div>
                    <div class="filtro-grupo" id="grupoEquipamiento" hidden>
                        <h3>Equipamiento</h3>
                        <div id="opcionesEquipamiento"></div>
                    </div>
                    <div class="filtro-grupo" id="grupoEtiquetas" hidden>
                        <h3>Etiquetas</h3>
                        <ul class="etiquetas" id="opcionesEtiquetas"></ul>
                    </div>
                    <button class="btn" type="button" id="quitarFiltros" hidden>Quitar filtros</button>
                </section>
                <section class="panel" aria-labelledby="tituloGrafica">
                    <h2 id="tituloGrafica">Lo que más pesa en tus recomendaciones</h2>
                    <div id="grafica"></div>
                </section>
            </details>

            <section aria-labelledby="sectionTitle">
                <div class="cabecera-seccion">
                    <h1 id="sectionTitle"></h1>
                    <div id="statsBar" class="conteo" role="status"></div>
                </div>
                <div id="discoveryZone"></div>
                <div id="resultsGrid" class="cuadricula"></div>
            </section>
        </main>

        <!-- VISTA 2: explorar por árboles -->
        <main class="contenedor arboles" id="vistaArboles" hidden>
            <div class="panel">
                <h1 class="cabecera-seccion" style="font-size:var(--texto-xl)">Explorar por árboles</h1>
                <p>Elige un músculo y un tema para ver los artículos que tratan los dos.</p>
                <form class="arboles-form" id="formAB">
                    <label class="campo">Músculo <select id="menuA"></select></label>
                    <label class="campo">Tema <select id="menuB"></select></label>
                    <button class="btn btn-primario" type="submit">Ver artículos</button>
                </form>
                <div id="resultadoAB" class="arboles-resultado"></div>
            </div>
        </main>
    </div>

    <!-- DETALLE DE UNA TARJETA. showModal() deja el foco dentro y Escape la cierra. -->
    <dialog id="detalle" class="detalle" aria-labelledby="detalleTitulo">
        <div class="detalle-cab">
            <div>
                <span id="detalleTipo" class="tipo"></span>
                <h2 id="detalleTitulo" tabindex="-1"></h2>
            </div>
            <button type="button" class="btn" id="detalleCerrar">Cerrar</button>
        </div>
        <div class="detalle-cuerpo" id="detalleCuerpo"></div>
    </dialog>

    <div id="aviso" class="aviso" role="status" hidden></div>

<!-- ilustracion(origen, grupo_id_o_tema): dibujos propios de assets/anatomia y assets/temas -->
<script src="assets/ilustraciones.js"></script>
<script>
    // =========================================================================
    // Regla de seguridad: TODO texto que viene del servidor pasa por esc() antes de
    // entrar en innerHTML (o se asigna con textContent). Los ids se convierten con Number().
    // =========================================================================
    function esc(t) {
        return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    const $ = id => document.getElementById(id);

    const searchInput = $('searchInput');
    const resultsGrid = $('resultsGrid');
    const sectionTitle = $('sectionTitle');
    const statsBar = $('statsBar');
    const detalle = $('detalle');

    // ------------------------------------------------------------------ estado
    let generacion = 0;          // cambia al entrar con un perfil o salir: descarta respuestas viejas
    let correoActual = '';
    let modo = 'recomendaciones';  // 'recomendaciones' | 'busqueda'
    let consulta = '';
    let datos = [];              // tarjetas de la vista actual (sin filtrar)
    let sinHistorial = false;    // el perfil no tiene "me gusta"
    let detalleActual = null;    // 'origen:id' del documento abierto
    let aperturaActual = 0;      // número de la última apertura: descarta respuestas de aperturas anteriores
    const docs = new Map();      // 'origen:id' -> tarjeta (todo lo que se ha pintado)
    const infoEtiqueta = new Map();   // id -> {nombre, tipo}
    let catalogoEtiquetas = [];  // etiquetas.php: [{id, nombre, tipo, n}]
    const filtros = { tipos: new Set(['ejercicios', 'articulos']), nivel: new Set(), equipamiento: new Set(), etiquetas: new Set() };
    class SesionRequerida extends Error {}

    // ------------------------------------------------------------------ servidor
    async function api(url, cuerpo) {
        const opts = { credentials: 'same-origin', headers: {} };
        if (cuerpo !== undefined) {
            opts.method = 'POST';
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(cuerpo);
        }
        const res = await fetch(url, opts);
        let data;
        try { data = await res.json(); } catch { data = { status: 'error', mensaje: 'Respuesta inválida del servidor' }; }
        if (res.status === 401 && url !== 'login.php') { salirAlAcceso(); throw new SesionRequerida(); }
        if (res.status === 409 && data.requiere === 'perfil') { mostrarPerfiles(); throw new SesionRequerida(); }
        return data;
    }

    let temporizadorAviso;
    function avisar(texto) {
        const a = $('aviso');
        a.textContent = texto;
        a.hidden = false;
        clearTimeout(temporizadorAviso);
        temporizadorAviso = setTimeout(() => { a.hidden = true; }, 5000);
    }

    // ------------------------------------------------------------------ tarjetas
    const CORAZON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

    function claveDoc(d) {
        return `${d.origen === 'articulos' ? 'articulos' : 'ejercicios'}:${Number(d.doc_id) || 0}`;
    }

    function recordar(d) {
        docs.set(claveDoc(d), d);
        (d.etiquetas || []).forEach(e => infoEtiqueta.set(Number(e.id), { nombre: e.nombre, tipo: e.tipo }));
    }

    function etiquetaHTML(e, conteo) {
        const id = Number(e.id);
        const activa = filtros.nivel.has(id) || filtros.equipamiento.has(id) || filtros.etiquetas.has(id);
        return `<li><button type="button" class="etiqueta" data-etiqueta="${id}" aria-pressed="${activa}"
                    title="Filtrar por ${esc(e.nombre)}">${esc(e.nombre)}${conteo === undefined ? '' : ` <span class="n">${Number(conteo)}</span>`}</button></li>`;
    }

    // Ilustración del documento: el músculo del ejercicio o el tema del artículo.
    // `encuadre: 'medio'` acerca el cuerpo en las tarjetas; el detalle lo muestra completo.
    function imagenHTML(d, opciones) {
        const origen = claveDoc(d).split(':')[0];
        return ilustracion(origen, origen === 'ejercicios' ? d.grupo_id : d.tema, opciones);
    }

    // Misma estructura siempre: imagen (recuadro 16:9), tipo + me gusta, título, resumen
    // (3 líneas), metadatos y etiquetas.
    function tarjetaHTML(d) {
        recordar(d);
        const clave = claveDoc(d);
        const origen = clave.split(':')[0];
        const meta = d.meta || {};
        const dato = v => v ? esc(v) : '<span aria-label="Sin dato">—</span>';
        const chips = (d.etiquetas || []).filter(e => e.tipo === 'tema' || e.tipo === 'modalidad').slice(0, 4);
        return `
            <article class="tarjeta" data-doc="${clave}">
                <div class="tarjeta-imagen">${imagenHTML(d, { encuadre: 'medio' })}</div>
                <div class="tarjeta-cab">
                    <span class="tipo tipo-${origen}">${esc(d.tipo)}</span>
                    <button type="button" class="btn-gusta" data-gusta aria-pressed="${d.liked ? 'true' : 'false'}"
                            aria-label="Me gusta: ${esc(d.titulo)}">${CORAZON}</button>
                </div>
                <h3 class="tarjeta-titulo"><button type="button" class="abrir" data-abrir>${esc(d.titulo)}</button></h3>
                <p class="tarjeta-resumen">${esc(d.resumen)}</p>
                <dl class="tarjeta-meta">
                    <div><dt>Músculo</dt><dd>${dato(meta.musculo)}</dd></div>
                    <div><dt>Equipamiento</dt><dd>${dato(meta.equipamiento)}</dd></div>
                    <div><dt>Nivel</dt><dd>${dato(meta.nivel)}</dd></div>
                </dl>
                <ul class="etiquetas">${chips.map(e => etiquetaHTML(e)).join('')}</ul>
            </article>`;
    }

    // ------------------------------------------------------------------ filtros (sobre los resultados actuales)
    function pasaFiltros(d) {
        const origen = claveDoc(d).split(':')[0];
        if (!filtros.tipos.has(origen)) return false;
        const ids = new Set((d.etiquetas || []).map(e => Number(e.id)));
        for (const grupo of ['nivel', 'equipamiento']) {           // dentro del grupo: cualquiera
            if (filtros[grupo].size && ![...filtros[grupo]].some(i => ids.has(i))) return false;
        }
        for (const i of filtros.etiquetas) if (!ids.has(i)) return false;   // etiquetas: todas
        return true;
    }

    function hayFiltros() {
        return filtros.tipos.size < 2 || filtros.nivel.size || filtros.equipamiento.size || filtros.etiquetas.size;
    }

    function quitarFiltros() {
        filtros.tipos = new Set(['ejercicios', 'articulos']);
        ['nivel', 'equipamiento', 'etiquetas'].forEach(g => filtros[g].clear());
    }

    function alternarEtiqueta(id) {
        const tipo = infoEtiqueta.get(id)?.tipo;
        const grupo = filtros[tipo === 'nivel' || tipo === 'equipamiento' ? tipo : 'etiquetas'];
        grupo.has(id) ? grupo.delete(id) : grupo.add(id);
        pintarResultados();
    }

    function pintarFiltros() {
        const conteo = new Map();
        let nEj = 0, nAr = 0;
        datos.forEach(d => {
            claveDoc(d).startsWith('articulos') ? nAr++ : nEj++;
            (d.etiquetas || []).forEach(e => conteo.set(Number(e.id), (conteo.get(Number(e.id)) || 0) + 1));
        });
        $('nEjercicios').textContent = nEj;
        $('nArticulos').textContent = nAr;
        document.querySelectorAll('[data-tipo]').forEach(c => { c.checked = filtros.tipos.has(c.dataset.tipo); });

        const deTipo = tipos => [...conteo.entries()]
            .map(([id, n]) => ({ id, n, ...infoEtiqueta.get(id) }))
            .filter(e => tipos.includes(e.tipo))
            .sort((a, b) => b.n - a.n || a.nombre.localeCompare(b.nombre, 'es'));

        for (const [grupo, cont, caja] of [['nivel', 'opcionesNivel', 'grupoNivel'], ['equipamiento', 'opcionesEquipamiento', 'grupoEquipamiento']]) {
            const lista = deTipo([grupo]);
            $(caja).hidden = !lista.length;
            $(cont).innerHTML = lista.map(e => `
                <label class="opcion"><input type="checkbox" data-filtro="${grupo}" value="${e.id}" ${filtros[grupo].has(e.id) ? 'checked' : ''}>
                    ${esc(e.nombre)} <span class="n">${e.n}</span></label>`).join('');
        }

        const todas = deTipo(['musculo', 'modalidad', 'tema']);
        const visibles = todas.filter((e, i) => i < 12 || filtros.etiquetas.has(e.id));
        $('grupoEtiquetas').hidden = !visibles.length;
        $('opcionesEtiquetas').innerHTML = visibles.map(e => etiquetaHTML(e, e.n)).join('');
        $('quitarFiltros').hidden = !hayFiltros();
    }

    function plural(n, uno, varios) { return `${n} ${n === 1 ? uno : varios}`; }

    function pintarResultados() {
        pintarFiltros();
        if (!datos.length) {
            statsBar.textContent = '';
            if (modo === 'recomendaciones' && sinHistorial) {
                const musculos = catalogoEtiquetas.filter(e => e.tipo === 'musculo').slice(0, 11);
                resultsGrid.innerHTML = `<div class="estado">
                    <p>Da «me gusta» a un ejercicio para recibir recomendaciones. Busca uno arriba${musculos.length ? ' o empieza por un músculo:' : '.'}</p>
                    <ul class="etiquetas" style="justify-content:center">${musculos.map(e =>
                        `<li><button type="button" class="etiqueta" data-buscar="${esc(e.nombre)}">${esc(e.nombre)}</button></li>`).join('')}</ul>
                </div>`;
            } else if (modo === 'recomendaciones') {
                resultsGrid.innerHTML = '<div class="estado"><p>Ya viste todo lo parecido a tus «me gusta». Busca otro ejercicio y márcalo para recibir más.</p></div>';
            } else {
                resultsGrid.innerHTML = `<div class="estado"><p>No hay resultados para «${esc(consulta)}». Prueba con otra palabra o revisa la ortografía.</p></div>`;
            }
            return;
        }
        const visibles = datos.filter(pasaFiltros);
        statsBar.textContent = visibles.length === datos.length
            ? plural(datos.length, 'resultado', 'resultados')
            : `${visibles.length} de ${plural(datos.length, 'resultado', 'resultados')}`;
        resultsGrid.innerHTML = visibles.length
            ? visibles.map(tarjetaHTML).join('')
            : '<div class="estado"><p>Ningún resultado cumple los filtros.</p><button type="button" class="btn" data-quitar-filtros>Quitar filtros</button></div>';
    }

    function pintarError(reintentar) {
        statsBar.textContent = '';
        resultsGrid.innerHTML = '<div class="estado estado-error"><p>No se pudo cargar. Revisa tu conexión e intenta de nuevo.</p><button type="button" class="btn" id="btnReintentar">Reintentar</button></div>';
        $('btnReintentar').addEventListener('click', reintentar);
    }

    // ------------------------------------------------------------------ gráfica del perfil
    // Barras horizontales, un solo color, de mayor a menor y con el valor al lado.
    function pintarGrafica(terminos) {
        const g = $('grafica');
        if (!terminos || !terminos.length) {
            g.innerHTML = '<p class="sin-opciones">Da «me gusta» a un ejercicio para personalizar tus recomendaciones.</p>';
            return;
        }
        const lista = terminos.slice(0, 8).map(t => ({ palabra: t.palabra || t.termino, peso: Number(t.peso) || 0 }))
            .sort((a, b) => b.peso - a.peso);
        const max = lista[0].peso || 1;
        g.innerHTML = `<div class="barras" role="list">${lista.map(t => `
            <div class="barra-fila" role="listitem">
                <span class="termino" title="${esc(t.palabra)}">${esc(t.palabra)}</span>
                <span class="pista"><span class="relleno" style="width:${Math.max(2, Math.round(t.peso / max * 100))}%"></span></span>
                <span class="valor">${t.peso.toFixed(2)}</span>
            </div>`).join('')}</div>`;
    }

    // ------------------------------------------------------------------ recomendaciones
    function cargarRecomendaciones({ soloGrafica = false } = {}) {
        const gen = generacion;
        if (!soloGrafica) {
            modo = 'recomendaciones';
            consulta = '';
            sectionTitle.textContent = 'Recomendado para ti';
            statsBar.textContent = '';
            $('discoveryZone').innerHTML = '';
            resultsGrid.innerHTML = '<div class="estado"><p>Cargando recomendaciones…</p></div>';
        }
        return api('recomendaciones.php')
            .then(data => {
                if (gen !== generacion) return;                  // respuesta de un perfil anterior
                if (data.status === 'error') throw new Error(data.mensaje);
                const vacio = data.status === 'cold_start';
                pintarGrafica(vacio ? null : data.perfil_terminos);
                if (soloGrafica || modo !== 'recomendaciones') return;
                sinHistorial = vacio;
                datos = vacio ? [] : (data.recomendaciones || []);
                quitarFiltros();
                pintarResultados();
            })
            .catch(e => { if (!(e instanceof SesionRequerida) && !soloGrafica && gen === generacion) pintarError(() => cargarRecomendaciones()); });
    }

    // ------------------------------------------------------------------ búsqueda
    // Cada búsqueda lleva un número: solo se pinta la respuesta de la ÚLTIMA.
    let busquedaActual = 0, temporizador;

    function buscar(texto) {
        clearTimeout(temporizador);
        const q = texto.trim();
        mostrarVista('vistaBusqueda');
        if (q.length < 2) {
            busquedaActual++;                                   // invalida búsquedas en vuelo
            if (modo !== 'recomendaciones') cargarRecomendaciones();
            return;
        }
        modo = 'busqueda';
        consulta = q;
        sectionTitle.textContent = `Resultados de «${q}»`;
        statsBar.textContent = '';
        $('discoveryZone').innerHTML = '';
        resultsGrid.innerHTML = '<div class="estado"><p>Buscando…</p></div>';
        const gen = generacion, id = ++busquedaActual;
        api(`buscar.php?q=${encodeURIComponent(q)}`)
            .then(data => {
                if (gen !== generacion || id !== busquedaActual) return;    // respuesta vieja
                if (data.status === 'error') throw new Error(data.mensaje);
                datos = data.resultados || [];
                quitarFiltros();
                pintarDescubrimiento(data.descubrimiento);
                pintarResultados();
            })
            .catch(e => { if (!(e instanceof SesionRequerida) && id === busquedaActual) pintarError(() => buscar(q)); });
    }

    searchInput.addEventListener('input', () => {
        clearTimeout(temporizador);
        temporizador = setTimeout(() => buscar(searchInput.value), 400);
    });
    $('formBusqueda').addEventListener('submit', e => { e.preventDefault(); buscar(searchInput.value); });

    function rutaHTML(nodos, nombreArbol) {
        if (!nodos || !nodos.length) return '';
        return `<ul class="ruta" aria-label="${esc(nombreArbol)}">${nodos.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
    }

    // Artículo que el sistema relaciona con la búsqueda a través de los árboles.
    function pintarDescubrimiento(d) {
        const zona = $('discoveryZone');
        if (!d || d.sin_documento || !d.doc_id) { zona.innerHTML = ''; return; }
        zona.innerHTML = `
            <section class="panel relacionado-busqueda" aria-labelledby="tituloRelacionado">
                <h2 id="tituloRelacionado">Relacionado con tu búsqueda</h2>
                <p class="porque"><strong>Por qué aparece esto:</strong> ${esc(d.razon_algoritmica)}</p>
                <div class="rutas">${rutaHTML(d.origen_ruta, 'Ruta de origen')}${rutaHTML(d.destino_ruta, 'Ruta de destino')}</div>
                <div class="cuadricula">${tarjetaHTML(d)}</div>
            </section>`;
    }

    // ------------------------------------------------------------------ "me gusta"
    function marcarGusta(clave, gusta) {
        const d = docs.get(clave);
        if (d) d.liked = gusta;
        document.querySelectorAll(`[data-doc="${clave}"] [data-gusta]`).forEach(b => b.setAttribute('aria-pressed', String(gusta)));
        if (detalleActual === clave) pintarBotonGustaDetalle(gusta);
    }

    function alternarGusta(clave) {
        const [origen, id] = clave.split(':');
        const antes = !!docs.get(clave)?.liked;
        marcarGusta(clave, !antes);                              // respuesta inmediata
        // Solo doc_id y origen: el perfil lo pone el servidor desde la sesión
        api('registrar_interaccion.php', { doc_id: Number(id), origen })
            .then(data => {
                if (data.status === 'error') throw new Error();
                marcarGusta(clave, data.status === 'added');
                // El perfil cambió: se actualiza la gráfica y, si se están viendo, las recomendaciones
                if (modo === 'recomendaciones' && !detalle.open) cargarRecomendaciones();
                else cargarRecomendaciones({ soloGrafica: true });
            })
            .catch(e => {
                if (e instanceof SesionRequerida) return;
                marcarGusta(clave, antes);
                avisar('No se pudo guardar tu «me gusta». Intenta de nuevo.');
            });
    }

    // ------------------------------------------------------------------ detalle de una tarjeta
    function pintarBotonGustaDetalle(gusta) {
        const b = $('detalleGusta');
        if (!b) return;
        b.setAttribute('aria-pressed', String(gusta));
        b.textContent = gusta ? 'Quitar «me gusta»' : 'Me gusta';
    }

    async function abrirDetalle(clave) {
        const [origen, id] = clave.split(':');
        const previo = docs.get(clave);
        const apertura = ++aperturaActual;
        detalleActual = clave;
        $('detalleTipo').textContent = previo?.tipo || '';
        $('detalleTipo').className = `tipo tipo-${origen}`;
        $('detalleTitulo').textContent = previo?.titulo || '';
        $('detalleCuerpo').innerHTML = '<p class="conteo">Cargando…</p>';
        if (!detalle.open) detalle.showModal();
        else $('detalleCerrar').focus();                         // al saltar a un relacionado

        // Estadística de apertura: nunca molesta al usuario. Solo doc_id y origen.
        api('registrar_evento.php', { doc_id: Number(id), origen }).catch(() => {});

        const gen = generacion;
        let r;
        try { r = await api(`detalle.php?origen=${origen}&doc_id=${Number(id)}`); }
        catch (e) { if (e instanceof SesionRequerida) { detalle.close(); return; } r = { status: 'error' }; }
        if (apertura !== aperturaActual || gen !== generacion || !detalle.open) return;
        if (r.status !== 'success') {
            $('detalleCuerpo').innerHTML = '<p class="msg-error">No se pudo abrir el documento. Ciérralo e intenta de nuevo.</p>';
            return;
        }
        const d = r.documento;
        recordar({ ...previo, ...d, resumen: previo?.resumen ?? '' });
        (r.relacionados || []).forEach(recordar);
        $('detalleTipo').textContent = d.tipo;
        $('detalleTitulo').textContent = d.titulo;
        const meta = d.meta || {};
        const metaFilas = [['Músculo', meta.musculo], ['Equipamiento', meta.equipamiento], ['Nivel', meta.nivel]]
            .filter(f => f[1]).map(f => `<div><dt>${f[0]}</dt><dd>${esc(f[1])}</dd></div>`).join('');
        $('detalleCuerpo').innerHTML = `
            <div class="detalle-principal">
                <div class="detalle-imagen">${imagenHTML(d)}</div>
                <div class="detalle-info">
                    <div class="detalle-acciones">
                        <button type="button" class="btn btn-gusta-texto" id="detalleGusta" aria-pressed="false"></button>
                    </div>
                    ${d.ruta ? `<div><h3>Ubicación en el árbol</h3>${rutaHTML(d.ruta.nodos, 'Ubicación en el árbol')}</div>` : ''}
                    ${metaFilas ? `<dl class="tarjeta-meta" style="border-top:0; padding-top:0">${metaFilas}</dl>` : ''}
                    <p class="detalle-texto">${esc(d.texto)}</p>
                </div>
            </div>
            ${(d.etiquetas || []).length ? `<div><h3>Etiquetas</h3><ul class="etiquetas">${d.etiquetas.map(e => etiquetaHTML(e)).join('')}</ul></div>` : ''}
            ${(r.relacionados || []).length ? `<div><h3>Documentos relacionados</h3><div class="relacionados">${r.relacionados.slice(0, 4).map(x => `
                <button type="button" class="relacionado" data-relacionado="${claveDoc(x)}">
                    <span><span class="tipo tipo-${claveDoc(x).split(':')[0]}">${esc(x.tipo)}</span></span>
                    <span class="titulo">${esc(x.titulo)}</span>
                    <span class="comparte">Comparte: ${esc((x.comparte || []).join(', '))}</span>
                </button>`).join('')}</div></div>` : ''}`;
        pintarBotonGustaDetalle(!!d.liked);
        const enTarjeta = docs.get(clave);
        if (enTarjeta) enTarjeta.liked = !!d.liked;
    }

    // showModal() ya impide llegar al contenido de atrás, pero Tab en el último elemento
    // sale hacia la barra del navegador: aquí se cicla dentro del detalle.
    detalle.addEventListener('keydown', e => {
        if (e.key !== 'Tab') return;
        const foco = [...detalle.querySelectorAll('button, [href], input, select, textarea')]
            .filter(el => !el.disabled && el.getClientRects().length);
        if (!foco.length) return;
        const primero = foco[0], ultimo = foco[foco.length - 1];
        const dentro = detalle.contains(document.activeElement) && document.activeElement !== detalle;
        if (e.shiftKey && (document.activeElement === primero || !dentro)) { e.preventDefault(); ultimo.focus(); }
        else if (!e.shiftKey && (document.activeElement === ultimo || !dentro)) { e.preventDefault(); primero.focus(); }
    });

    $('detalleCerrar').addEventListener('click', () => detalle.close());
    detalle.addEventListener('click', e => { if (e.target === detalle) detalle.close(); });   // clic fuera
    detalle.addEventListener('close', () => {
        // El evento llega después del cierre: si el usuario ya volvió a abrir un detalle,
        // no se toca su estado (antes lo borraba y el detalle se quedaba en «Cargando…»).
        if (detalle.open) return;
        const clave = detalleActual;
        detalleActual = null;
        if (modo === 'recomendaciones' && docs.get(clave)?.liked) cargarRecomendaciones();   // ya no debe recomendarse
        document.querySelector(`[data-doc="${clave}"] [data-abrir]`)?.focus();
    });

    // ------------------------------------------------------------------ clics (delegados)
    document.addEventListener('click', e => {
        const t = e.target;
        const etiqueta = t.closest('[data-etiqueta]');
        if (etiqueta) {
            if (detalle.open) detalle.close();
            mostrarVista('vistaBusqueda');
            alternarEtiqueta(Number(etiqueta.dataset.etiqueta));
            return;
        }
        const buscarBtn = t.closest('[data-buscar]');
        if (buscarBtn) { searchInput.value = buscarBtn.dataset.buscar; buscar(searchInput.value); return; }
        if (t.closest('[data-quitar-filtros]') || t.closest('#quitarFiltros')) { quitarFiltros(); pintarResultados(); return; }
        const relacionado = t.closest('[data-relacionado]');
        if (relacionado) { abrirDetalle(relacionado.dataset.relacionado); return; }
        if (t.closest('#detalleGusta')) { if (detalleActual) alternarGusta(detalleActual); return; }
        const tarjeta = t.closest('.tarjeta[data-doc]');
        if (!tarjeta) return;
        if (t.closest('[data-gusta]')) alternarGusta(tarjeta.dataset.doc);
        else abrirDetalle(tarjeta.dataset.doc);
    });

    document.addEventListener('change', e => {
        const c = e.target;
        if (c.dataset.tipo) { c.checked ? filtros.tipos.add(c.dataset.tipo) : filtros.tipos.delete(c.dataset.tipo); pintarResultados(); }
        else if (c.dataset.filtro) { const g = filtros[c.dataset.filtro], id = Number(c.value); c.checked ? g.add(id) : g.delete(id); pintarResultados(); }
    });

    // ------------------------------------------------------------------ cuentas y perfiles
    function mostrarPantalla(id) {
        ['pantallaAcceso', 'pantallaPerfiles', 'app'].forEach(p => { $(p).hidden = p !== id; });
        $('formBusqueda').hidden = $('menuPerfil').hidden = id !== 'app';
        $('menuPerfil').open = false;
    }

    function limpiarVistaPerfil() {
        generacion++;
        busquedaActual++;
        clearTimeout(temporizador);
        if (detalle.open) detalle.close();
        datos = [];
        docs.clear();
        sinHistorial = false;
        modo = 'recomendaciones';
        consulta = '';
        quitarFiltros();
        resultsGrid.innerHTML = '';
        $('discoveryZone').innerHTML = '';
        $('grafica').innerHTML = '';
        $('resultadoAB').innerHTML = '';
        statsBar.textContent = '';
        searchInput.value = '';
    }

    function salirAlAcceso() {
        limpiarVistaPerfil();
        correoActual = '';
        document.querySelectorAll('#pantallaAcceso form').forEach(f => f.reset());
        mostrarPantalla('pantallaAcceso');
    }

    async function mostrarPerfiles() {
        limpiarVistaPerfil();
        mostrarPantalla('pantallaPerfiles');
        try { renderPerfiles(await api('perfiles.php')); } catch (e) { /* ya redirigido */ }
    }

    function renderPerfiles(d) {
        const err = $('errPerfiles');
        if (d.status !== 'success') { err.textContent = d.mensaje || 'No se pudieron cargar los perfiles.'; return; }
        err.textContent = '';
        $('listaPerfiles').innerHTML = d.perfiles.length ? d.perfiles.map(p => `
            <div class="perfil-item">
                <button class="elegir" type="button" data-elegir="${Number(p.id)}">${esc(p.nombre)}</button>
                <button class="borrar" type="button" data-borrar="${Number(p.id)}" aria-label="Eliminar el perfil ${esc(p.nombre)}">Eliminar</button>
            </div>`).join('')
            : '<p class="sin-opciones">Crea tu primer perfil para empezar.</p>';
        $('formPerfil').hidden = d.perfiles.length >= d.maximo;
    }

    function entrarApp(perfil) {
        limpiarVistaPerfil();
        $('nombrePerfil').textContent = perfil.nombre;
        $('correoCuenta').textContent = correoActual;
        mostrarPantalla('app');
        mostrarVista('vistaBusqueda');
        cargarCatalogos();
        cargarRecomendaciones();
    }

    async function iniciar() {
        try {
            const s = await api('sesion.php');
            if (!s.autenticado) return salirAlAcceso();
            correoActual = s.correo;
            if (!s.perfil_activo) return mostrarPerfiles();
            entrarApp(s.perfil_activo);
        } catch (e) {
            if (!(e instanceof SesionRequerida)) salirAlAcceso();
        }
    }

    function datosForm(form) { return Object.fromEntries(new FormData(form).entries()); }

    function tabAcceso(registro) {
        $('formLogin').hidden = registro;
        $('formRegistro').hidden = !registro;
        $('tabLogin').setAttribute('aria-selected', String(!registro));
        $('tabRegistro').setAttribute('aria-selected', String(registro));
    }
    $('tabLogin').addEventListener('click', () => tabAcceso(false));
    $('tabRegistro').addEventListener('click', () => tabAcceso(true));

    $('formLogin').addEventListener('submit', async e => {
        e.preventDefault();
        const err = $('errLogin');
        err.textContent = '';
        const d = await api('login.php', datosForm(e.target)).catch(() => ({ mensaje: 'Sin conexión. Intenta de nuevo.' }));
        if (d.status === 'success') { e.target.reset(); iniciar(); } else { err.textContent = d.mensaje; }
    });

    $('formRegistro').addEventListener('submit', async e => {
        e.preventDefault();
        const err = $('errRegistro');
        err.textContent = '';
        const d = await api('registro.php', datosForm(e.target)).catch(() => ({ mensaje: 'Sin conexión. Intenta de nuevo.' }));
        if (d.status === 'success') { e.target.reset(); iniciar(); }
        else { err.textContent = d.errores ? Object.values(d.errores).join(' · ') : d.mensaje; }
    });

    $('formPerfil').addEventListener('submit', async e => {
        e.preventDefault();
        const d = await api('perfiles.php', { accion: 'crear', ...datosForm(e.target) }).catch(() => null);
        if (!d) return;
        if (d.status === 'success') { e.target.reset(); renderPerfiles(d); }
        else renderPerfilesConError(d.mensaje);
    });

    async function renderPerfilesConError(mensaje) {
        renderPerfiles(await api('perfiles.php'));
        $('errPerfiles').textContent = mensaje;
    }

    $('listaPerfiles').addEventListener('click', async e => {
        const elegir = e.target.closest('[data-elegir]'), borrar = e.target.closest('[data-borrar]');
        try {
            if (elegir) {
                const d = await api('seleccionar_perfil.php', { perfil_id: Number(elegir.dataset.elegir) });
                if (d.status === 'success') entrarApp(d.perfil_activo);
                else $('errPerfiles').textContent = d.mensaje;
            } else if (borrar && confirm('¿Eliminar este perfil y todos sus «me gusta»? No se puede deshacer.')) {
                const d = await api('perfiles.php', { accion: 'eliminar', perfil_id: Number(borrar.dataset.borrar) });
                if (d.status === 'success') renderPerfiles(d); else renderPerfilesConError(d.mensaje);
            }
        } catch (err) { /* SesionRequerida: ya redirigido */ }
    });

    $('btnCambiarPerfil').addEventListener('click', mostrarPerfiles);
    document.querySelectorAll('[data-accion="logout"]').forEach(b => b.addEventListener('click', async () => {
        await api('logout.php', {}).catch(() => null);
        salirAlAcceso();
    }));

    // El menú del perfil se cierra con Escape o al hacer clic fuera
    const menuPerfil = $('menuPerfil');
    document.addEventListener('click', e => { if (menuPerfil.open && !menuPerfil.contains(e.target)) menuPerfil.open = false; });
    menuPerfil.addEventListener('keydown', e => {
        if (e.key === 'Escape' && menuPerfil.open) { menuPerfil.open = false; menuPerfil.querySelector('summary').focus(); }
    });

    // ------------------------------------------------------------------ explorar por árboles
    let catalogoAB = null;
    const menuA = $('menuA'), menuB = $('menuB');

    function opcionesB() {
        const previo = menuB.value;
        menuB.innerHTML = catalogoAB.temas.map(t => {
            const n = (catalogoAB.puentes[`${menuA.value}|${t.nombre}`] || []).length;
            return `<option value="${esc(t.nombre)}">${esc(t.nombre)} (${plural(n, 'artículo', 'artículos')})</option>`;
        }).join('');
        if (previo) menuB.value = previo;
    }

    function cargarCatalogos() {
        const gen = generacion;
        api('etiquetas.php').then(c => {
            if (c.status !== 'success') return;
            catalogoEtiquetas = c.etiquetas || [];
            catalogoEtiquetas.forEach(e => infoEtiqueta.set(Number(e.id), { nombre: e.nombre, tipo: e.tipo }));
            if (gen === generacion && sinHistorial && modo === 'recomendaciones') pintarResultados();
        }).catch(() => {});
        if (catalogoAB) return;
        api('menus.php?accion=catalogo').then(c => {
            if (c.status !== 'success') throw new Error();
            catalogoAB = c;
            menuA.innerHTML = c.musculos.map(m =>
                `<option value="${Number(m.gid)}">${esc(m.nombre)} (${plural(Number(m.n_ejercicios), 'ejercicio', 'ejercicios')})</option>`).join('');
            opcionesB();
        }).catch(e => {
            if (!(e instanceof SesionRequerida)) {
                $('resultadoAB').innerHTML = '<p class="msg-error">No se pudieron cargar los músculos y temas. Recarga la página.</p>';
            }
        });
    }
    menuA.addEventListener('change', () => { if (catalogoAB) opcionesB(); });

    $('formAB').addEventListener('submit', e => {
        e.preventDefault();
        if (!catalogoAB) return;
        const out = $('resultadoAB');
        const m = catalogoAB.musculos.find(x => String(x.gid) === menuA.value);
        const t = catalogoAB.temas.find(x => x.nombre === menuB.value);
        if (!m || !t) return;
        const ids = catalogoAB.puentes[`${m.gid}|${t.nombre}`] || [];
        const rutas = `<div class="rutas">${rutaHTML(['Cuerpo humano', m.region, m.nombre], 'Árbol de anatomía')}${rutaHTML(['Conocimiento', t.rama, t.nombre], 'Árbol de temas')}</div>`;

        if (!ids.length) {
            const alt = catalogoAB.temas
                .map(x => [x.nombre, (catalogoAB.puentes[`${m.gid}|${x.nombre}`] || []).length])
                .filter(a => a[1]).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es')).slice(0, 3)
                .map(a => `${esc(a[0])} (${a[1]})`).join(', ');
            out.innerHTML = rutas + `<div class="estado"><p>Ningún artículo trata «${esc(m.nombre)}» y «${esc(t.nombre)}» a la vez.${
                alt ? ` Temas que sí tienen artículos sobre ese músculo: ${alt}.` : ' Elige otro músculo.'}</p></div>`;
            return;
        }
        out.innerHTML = rutas + '<div class="estado"><p>Cargando…</p></div>';
        const gen = generacion;
        api(`menus.php?accion=docs&m=${Number(m.gid)}&ids=${ids.map(Number).join(',')}`).then(d => {
            if (gen !== generacion) return;
            if (d.status !== 'success') throw new Error();
            out.innerHTML = rutas
                + `<h2>Artículos sobre «${esc(m.nombre)}» y «${esc(t.nombre)}»</h2><div class="cuadricula">${d.articulos.map(tarjetaHTML).join('')}</div>`
                + (d.ejercicios.length ? `<h2>Ejercicios de «${esc(m.nombre)}»</h2><div class="cuadricula">${d.ejercicios.map(tarjetaHTML).join('')}</div>` : '');
        }).catch(e => {
            if (!(e instanceof SesionRequerida)) out.innerHTML = rutas + '<div class="estado estado-error"><p>No se pudo cargar. Vuelve a pulsar «Ver artículos».</p></div>';
        });
    });

    // ------------------------------------------------------------------ pestañas y panel lateral
    function mostrarVista(id) {
        document.querySelectorAll('[data-vista]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.vista === id)));
        $('vistaBusqueda').hidden = id !== 'vistaBusqueda';
        $('vistaArboles').hidden = id !== 'vistaArboles';
    }
    document.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => mostrarVista(b.dataset.vista)));
    searchInput.addEventListener('focus', () => mostrarVista('vistaBusqueda'));   // buscar vuelve a la primera pestaña

    // En pantallas anchas el panel lateral siempre está abierto; en teléfono se pliega.
    const pantallaAncha = window.matchMedia('(min-width: 901px)');
    const ajustarLateral = () => { $('lateral').open = pantallaAncha.matches; };
    pantallaAncha.addEventListener('change', ajustarLateral);
    ajustarLateral();

    mostrarVista('vistaBusqueda');
    iniciar();
</script>

</body>
</html>
